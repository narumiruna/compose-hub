services:
  stalwart:
    image: stalwartlabs/stalwart:v0.16
    container_name: stalwart
    ports:
      - "127.0.0.1:8084:8080" # bootstrap administration
      - "443:443" # HTTPS / JMAP / WebDAV
      - "25:25" # SMTP
      - "587:587" # SMTP submission (STARTTLS)
      - "465:465" # SMTP submission (TLS)
      - "143:143" # IMAP (STARTTLS)
      - "993:993" # IMAP (TLS)
      - "110:110" # POP3 (STARTTLS)
      - "995:995" # POP3 (TLS)
      - "4190:4190" # ManageSieve
    volumes:
      - ./data/config:/etc/stalwart
      - ./data/storage:/var/lib/stalwart
    restart: unless-stopped

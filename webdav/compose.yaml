services:
  webdav:
    image: hacdias/webdav:latest
    container_name: webdav
    command: -c /config.yml
    ports:
      - 6065:6065
    environment:
      WEBDAV_USERNAME: ${WEBDAV_USERNAME:?Set WEBDAV_USERNAME in .env}
      WEBDAV_PASSWORD: ${WEBDAV_PASSWORD:?Set WEBDAV_PASSWORD in .env}
    volumes:
      - ./config.yml:/config.yml:ro
      - ./data:/data
    restart: unless-stopped

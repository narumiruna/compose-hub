services:
  webdav:
    build: .
    image: compose-hub/webdav-apache:2.4.66
    container_name: webdav
    ports:
      - 6065:6065
    environment:
      WEBDAV_USERNAME: ${WEBDAV_USERNAME:?Set WEBDAV_USERNAME in .env}
      WEBDAV_PASSWORD: ${WEBDAV_PASSWORD:?Set WEBDAV_PASSWORD in .env}
      WEBDAV_UID: ${WEBDAV_UID:-501}
      WEBDAV_GID: ${WEBDAV_GID:-20}
    volumes:
      - ./data:/data
      - dav-locks:/var/lib/dav
    restart: unless-stopped

volumes:
  dav-locks:
